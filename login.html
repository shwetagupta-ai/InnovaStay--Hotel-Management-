<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | InnovaStay</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<script src="/js/theme-init.js"></script>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-body">
<div class="auth-bg" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="grid-fx"></span></div>
<main class="auth-shell">
  <section class="auth-art" aria-hidden="true">
    <a class="brand" href="/"><img src="/assets/img/logo.svg" alt="" width="42" height="42"><span>InnovaStay</span></a>
    <h1>Welcome <em>back.</em></h1>
    <p>One secure sign-in for guests, staff, hotel owners and the platform team.</p>
    <ul class="art-points">
      <li><span></span>Encrypted passwords &amp; protected sessions</li>
      <li><span></span>Live rooms, bills and room service</li>
      <li><span></span>Light and dark mode, on every device</li>
    </ul>
    <div class="art-hotel"><img src="/assets/img/hotel-2.svg" alt=""></div>
  </section>

  <section class="auth-card" id="card" aria-live="polite">
    <div class="auth-top">
      <a class="back" href="/">&larr; Home</a>
      <span id="themeSlot"></span>
    </div>
    <div id="view"></div>
  </section>
</main>
<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
